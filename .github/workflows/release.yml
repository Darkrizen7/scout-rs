# Builds and publishes a GitHub Release when a version tag (v0.2.0, …) is pushed.
# Nothing runs on ordinary pushes: releases happen only when a tag is pushed by hand.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    # Oldest supported runner: an older glibc makes the binary run on more distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches Cargo.toml version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            lua5.4 libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
          # Tests call `lua`, the Debian package only installs `lua5.4`.
          sudo ln -sf /usr/bin/lua5.4 /usr/local/bin/lua

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --workspace --locked

      - name: Build
        run: cargo build --release --locked

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset=scout-rs-x86_64-linux
          cp target/release/scout-rs "$asset"
          sha256sum "$asset" > "$asset.sha256"
          gh release create "$GITHUB_REF_NAME" "$asset" "$asset.sha256" \
            --title "$GITHUB_REF_NAME" --generate-notes
