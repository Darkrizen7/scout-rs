[workspace]
resolver = "3"
members = ["app", "scout-core", "scout-gamedata", "scout-sources", "scout-db", "scout-worker", "scout-server"]
# `cargo run` / `cargo build` = the desktop app; the server (Linux only) is built by its Dockerfile.
default-members = ["app"]

[workspace.package]
version = "0.5.1"
edition = "2024"
license = "MIT"

[workspace.lints.clippy]
mod_module_files = { level = "warn" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = true
codegen-units = 1
lto = true
