[workspace]
resolver = "3"
members = ["app", "scout-core", "scout-sources", "scout-db", "scout-worker"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.lints.clippy]
mod_module_files = { level = "warn" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = true
codegen-units = 1
lto = true
