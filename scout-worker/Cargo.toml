[package]
name = "scout-worker"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
directories = "6.0.0"
flate2 = "1.1.11"
scout-core = { path = "../scout-core" }
scout-db = { path = "../scout-db" }
scout-gamedata = { path = "../scout-gamedata" }
scout-sources = { path = "../scout-sources" }
self-replace = "1.5.1"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
serde_json = "1.0.154"
toml = "1.2.2"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt"] }

[lints]
workspace = true
